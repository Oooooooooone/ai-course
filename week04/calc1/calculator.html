<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        /* CSS: 디자인 담당 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            width: 320px;
            background-color: #22252d;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        #display {
            width: 100%;
            height: 100px;
            font-size: 2.5rem;
            text-align: right;
            border: none;
            background: transparent;
            color: #ffffff;
            margin-bottom: 20px;
            padding: 10px;
            box-sizing: border-box;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border-radius: 15px;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #292d36;
            color: #ffffff;
        }

        button:active {
            transform: scale(0.95);
        }

        /* 숫자 버튼 색상 */
        .btn-number {
            color: #ffffff;
        }

        /* 연산자 버튼 색상 (주황색 계열) */
        .btn-operator {
            color: #eb6666;
        }

        /* 특수 기능 버튼 (C, Del) */
        .btn-special {
            color: #26ffd1;
        }

        /* '=' 버튼 (강조) */
        .btn-equal {
            background-color: #eb6666;
            color: white;
            grid-column: span 2;
        }

        button:hover {
            background-color: #353a46;
        }

        .btn-equal:hover {
            background-color: #ff7a7a;
        }
    </style>
</head>
<body>

<div class="calculator">
    <!-- 디스플레이 -->
    <input type="text" id="display" disabled value="0">
    
    <!-- 버튼들 -->
    <div class="buttons">
        <button class="btn-special" onclick="clearDisplay()">C</button>
        <button class="btn-special" onclick="deleteLast()">DEL</button>
        <button class="btn-operator" onclick="appendOperator('/')">÷</button>
        <button class="btn-operator" onclick="appendOperator('*')">×</button>

        <button class="btn-number" onclick="appendNumber('7')">7</button>
        <button class="btn-number" onclick="appendNumber('8')">8</button>
        <button class="btn-number" onclick="appendNumber('9')">9</button>
        <button class="btn-operator" onclick="appendOperator('-')">-</button>

        <button class="btn-number" onclick="appendNumber('4')">4</button>
        <button class="btn-number" onclick="appendNumber('5')">5</button>
        <button class="btn-number" onclick="appendNumber('6')">6</button>
        <button class="btn-operator" onclick="appendOperator('+')">+</button>

        <button class="btn-number" onclick="appendNumber('1')">1</button>
        <button class="btn-number" onclick="appendNumber('2')">2</button>
        <button class="btn-number" onclick="appendNumber('3')">3</button>
        <button class="btn-number" onclick="appendNumber('.')">.</button>

        <button class="btn-number" onclick="appendNumber('0')">0</button>
        <button class="btn-equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    // JavaScript: 계산 로직 담당
    let displayValue = '0';

    const displayElement = document.getElementById('display');

    function updateDisplay() {
        displayElement.value = displayValue;
    }

    // 숫자 입력
    function appendNumber(number) {
        if (displayValue === '0' && number !== '.') {
            displayValue = number;
        } else {
            displayValue += number;
        }
        updateDisplay();
    }

    // 연산자 입력
    function appendOperator(operator) {
        const lastChar = displayValue.slice(-1);
        // 마지막 글자가 이미 연산자라면 교체
        if (['+', '-', '*', '/'].includes(lastChar)) {
            displayValue = displayValue.slice(0, -1) + operator;
        } else {
            displayValue += operator;
        }
        updateDisplay();
    }

    // 전체 삭제 (C)
    function clearDisplay() {
        displayValue = '0';
        updateDisplay();
    }

    // 한 글자 삭제 (DEL)
    function deleteLast() {
        if (displayValue.length > 1) {
            displayValue = displayValue.slice(0, -1);
        } else {
            displayValue = '0';
        }
        updateDisplay();
    }

    // 계산 실행 (=)
    function calculate() {
        try {
            // eval 함수를 사용하여 문자열 수식을 계산 (간단한 프로젝트용)
            const result = eval(displayValue);
            
            // 소수점 자리수가 너무 길어지는 것 방지
            displayValue = Number.isInteger(result) ? result.toString() : result.toFixed(4).replace(/\.?0+$/, "");
            updateDisplay();
        } catch (error) {
            displayValue = "Error";
            updateDisplay();
            setTimeout(clearDisplay, 1500); // 에러 표시 후 1.5초 뒤 초기화
        }
    }
</script>

</body>
</html>
